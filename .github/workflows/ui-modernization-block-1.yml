name: UI Modernization Governance

on:
  pull_request:
    paths:
      - "config/ui-governance.json"
      - "system/validate_ui_governance.py"
      - "tests/test_ui_governance.py"
      - "system/generate_design_tokens.py"
      - "generated/design_tokens.py"
      - "tests/test_design_token_runtime.py"
      - "dateiindex/struktur/UI_MODERNISIERUNG_BLOCK_*.md"
      - "dateiindex/struktur/TESTMATRIX_UI_MODERNISIERUNG.md"
      - "dateiindex/gehaertet/UI_MODERNISIERUNG_BLOCK_*.md"
      - "dateiindex/index.json"
      - ".github/workflows/ui-modernization-block-*.yml"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testabhängigkeit installieren
        run: python -m pip install --disable-pip-version-check pytest
      - name: Governance-Vertrag testen
        run: python -m pytest -q tests/test_ui_governance.py
      - name: Governance vollständig validieren
        run: python system/validate_ui_governance.py
      - name: Blockabhängigen Diff begrenzen
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/ui-modernization-changed.txt
          cat /tmp/ui-modernization-changed.txt
          python system/validate_ui_governance.py \
            --changed-paths-file /tmp/ui-modernization-changed.txt
      - name: Design-Token-Drift ausschließen
        run: python system/generate_design_tokens.py --check
      - name: Syntax prüfen
        run: >-
          python -m py_compile
          system/validate_ui_governance.py
          tests/test_ui_governance.py
      - name: Repository unverändert halten
        run: git diff --exit-code
