name: Format Calendar Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Black 26.5.1 exakt anwenden
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black system/web_server.py tests/test_web_server.py
          if git diff --quiet -- system/web_server.py tests/test_web_server.py; then
            echo "Formatierung bereits aktuell."
            exit 0
          fi
          git config user.name "provoware-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add system/web_server.py tests/test_web_server.py
          git commit -m "Kalenderintegration: Black-Formatierung anwenden"
          git push origin "HEAD:$HEAD_BRANCH"
