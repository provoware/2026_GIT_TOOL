name: Private Tool Check

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-tool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-package:
    name: Prüfen und Privat-ZIP erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            config/requirements.txt
            mcp_dispatch/pyproject.toml

      - name: Headless-GUI-Unterstützung installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb python3-tk

      - name: Prüfabhängigkeiten installieren
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r config/requirements.txt
          python -m pip install -e "mcp_dispatch[dev]"

      - name: Privaten Kernvertrag ausführen
        env:
          PYTHON_BIN: python
        run: bash scripts/private_tool_check.sh

      - name: Geprüftes Privat-ZIP veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: 2026_GIT_TOOL-privat-geprueft
          path: |
            dist/2026_GIT_TOOL_PRIVAT.zip
            build/private-tool-check/
          if-no-files-found: error
          retention-days: 14
