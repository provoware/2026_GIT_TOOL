name: UI Modernization Block 2 Token Runtime

on:
  pull_request:
    paths:
      - "config/design-tokens.json"
      - "config/ui-governance.json"
      - "system/generate_design_tokens.py"
      - "system/validate_ui_governance.py"
      - "generated/design_tokens.py"
      - "tests/test_design_token_runtime.py"
      - "tests/test_ui_governance.py"
      - "dateiindex/struktur/UI_MODERNISIERUNG_BLOCK_2.md"
      - "dateiindex/struktur/TESTMATRIX_UI_MODERNISIERUNG.md"
      - "dateiindex/gehaertet/UI_MODERNISIERUNG_BLOCK_2.md"
      - "dateiindex/index.json"
      - ".github/workflows/ui-modernization-block-2.yml"

permissions:
  contents: read

jobs:
  token-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testabhängigkeit installieren
        run: python -m pip install --disable-pip-version-check pytest
      - name: Token-Runtime und Governance testen
        run: >-
          python -m pytest -q
          tests/test_design_token_runtime.py
          tests/test_ui_governance.py
      - name: Alle generierten Ausgaben prüfen
        run: python system/generate_design_tokens.py --check
      - name: Python-Artefakt regulär importieren
        run: |
          python - <<'PY'
          from generated import design_tokens

          assert design_tokens.DEFAULT_THEME == "acid-paper"
          assert design_tokens.SPACING_PX["4"] == 16
          assert design_tokens.BREAKPOINT_PX["desktop"] == 1200
          assert design_tokens.LAYOUT_PX["touchTarget"] == 44
          assert design_tokens.get_theme("neon-scrap")["surfaceElevated"] == "#20242D"
          PY
      - name: Block-2-Diff begrenzen
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/ui-block-2-changed.txt
          cat /tmp/ui-block-2-changed.txt
          python system/validate_ui_governance.py \
            --changed-paths-file /tmp/ui-block-2-changed.txt
      - name: Syntax prüfen
        run: >-
          python -m py_compile
          system/generate_design_tokens.py
          system/validate_ui_governance.py
          generated/design_tokens.py
          tests/test_design_token_runtime.py
          tests/test_ui_governance.py
      - name: Repository unverändert halten
        run: git diff --exit-code
