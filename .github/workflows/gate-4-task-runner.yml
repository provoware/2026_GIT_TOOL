name: Gate 4 Task Runner

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/task_runner.py"
      - "scripts/apply_gate4_task_runner.py"
      - "tests/test_task_runner.py"
      - "tests/test_gate4_task_runner_codemod.py"
      - ".github/workflows/gate-4-task-runner.yml"

permissions:
  contents: read

jobs:
  gate-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Task-Runner und Codemod testen
        run: >-
          python -m pytest -q
          tests/test_task_runner.py
          tests/test_gate4_task_runner_codemod.py
      - name: Integrierten Zustand prüfen
        run: |
          python scripts/apply_gate4_task_runner.py --check --path system/launcher_gui.py
          python -m py_compile system/launcher_gui.py system/task_runner.py
      - name: Repository unverändert halten
        run: git diff --exit-code
