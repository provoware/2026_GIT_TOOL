name: Gate 4 Task Runner

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/task_runner.py"
      - "scripts/apply_gate4_task_runner.py"
      - "tests/test_task_runner.py"
      - "tests/test_gate4_task_runner_codemod.py"
      - ".github/workflows/gate-4-task-runner.yml"

permissions:
  contents: write

jobs:
  gate-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Task-Runner und Codemod testen
        run: >-
          python -m pytest -q
          tests/test_task_runner.py
          tests/test_gate4_task_runner_codemod.py
      - name: Codemod auf vollständiger Arbeitskopie prüfen
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          python scripts/apply_gate4_task_runner.py --path /tmp/launcher_gui.py
          python scripts/apply_gate4_task_runner.py --check --path /tmp/launcher_gui.py
          python -m py_compile /tmp/launcher_gui.py system/task_runner.py
      - name: Task-Runner integrieren
        if: github.head_ref == 'agent/gate-4-task-runner'
        run: python scripts/apply_gate4_task_runner.py
      - name: Minimalen Integrationscommit veröffentlichen
        if: github.head_ref == 'agent/gate-4-task-runner'
        run: |
          if git diff --quiet -- system/launcher_gui.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/launcher_gui.py
          git commit -m "Gate 4: Task-Runner integrieren [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Repository sauber halten
        run: git diff --exit-code
