name: Format Complete Web Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exakte CI-Formatierung anwenden
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1
          FILES=(
            system/web_module_bridge.py
            system/web_server.py
            tests/test_web_module_bridge.py
            tests/test_web_ui_contract.py
            tests/test_web_server.py
          )
          python -m black "${FILES[@]}"
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Black-Formatierung bereits aktuell."
            exit 0
          fi
          git config user.name "provoware-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Webintegration deterministisch mit Black formatieren"
          git push origin "HEAD:$HEAD_BRANCH"
