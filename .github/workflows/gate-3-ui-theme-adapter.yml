name: Gate 3 UI Theme Adapter

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/main_window.py"
      - "system/ui_theme_adapter.py"
      - "scripts/apply_gate3_ui_theme_adapter.py"
      - "tests/test_ui_theme_adapter.py"
      - "tests/test_gate3_ui_theme_codemod.py"
      - ".github/workflows/gate-3-ui-theme-adapter.yml"

permissions:
  contents: read

jobs:
  gate-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Themevertrag und Codemod testen
        run: >-
          python -m pytest -q
          tests/test_ui_theme_adapter.py
          tests/test_gate3_ui_theme_codemod.py
      - name: Integrierten Zustand prüfen
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          cp system/main_window.py /tmp/main_window.py
          python scripts/apply_gate3_ui_theme_adapter.py --check --launcher /tmp/launcher_gui.py --main-window /tmp/main_window.py
          python -m py_compile system/launcher_gui.py system/main_window.py system/ui_theme_adapter.py
      - name: Repository unverändert halten
        run: git diff --exit-code
