name: Gate 3 UI Theme Adapter

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/main_window.py"
      - "system/ui_theme_adapter.py"
      - "scripts/apply_gate3_ui_theme_adapter.py"
      - "tests/test_ui_theme_adapter.py"
      - "tests/test_gate3_ui_theme_codemod.py"
      - ".github/workflows/gate-3-ui-theme-adapter.yml"

permissions:
  contents: write

jobs:
  gate-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Themevertrag und Codemod testen
        run: >-
          python -m pytest -q
          tests/test_ui_theme_adapter.py
          tests/test_gate3_ui_theme_codemod.py
      - name: Codemod auf vollständigen Arbeitskopien prüfen
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          cp system/main_window.py /tmp/main_window.py
          python scripts/apply_gate3_ui_theme_adapter.py --launcher /tmp/launcher_gui.py --main-window /tmp/main_window.py
          python scripts/apply_gate3_ui_theme_adapter.py --check --launcher /tmp/launcher_gui.py --main-window /tmp/main_window.py
          python -m py_compile /tmp/launcher_gui.py /tmp/main_window.py system/ui_theme_adapter.py
      - name: Themeadapter integrieren
        if: github.head_ref == 'agent/gate-3-ui-theme-adapter'
        run: python scripts/apply_gate3_ui_theme_adapter.py
      - name: Minimalen Integrationscommit veröffentlichen
        if: github.head_ref == 'agent/gate-3-ui-theme-adapter'
        run: |
          if git diff --quiet -- system/launcher_gui.py system/main_window.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/launcher_gui.py system/main_window.py
          git commit -m "Gate 3: gemeinsamen Themeadapter integrieren [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Repository sauber halten
        run: git diff --exit-code
