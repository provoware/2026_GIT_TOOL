name: Provoware Memo Startup and Full Export

on:
  pull_request:
    paths:
      - "scripts/start.sh"
      - "scripts/ensure_venv.sh"
      - "scripts/check_env.sh"
      - "scripts/run_tests.sh"
      - "system/startup_preflight.py"
      - "system/dependency_checker.py"
      - "system/web_server.py"
      - "system/web_module_bridge.py"
      - "scripts/web_interaction_probe.py"
      - "web/**"
      - "system/module_api_validator.py"
      - "config/product.json"
      - "config/test_gate.json"
      - "config/web_server.json"
      - "config/module_structure.json"
      - "config/module_selftests.json"
      - "tests/test_startup_preflight.py"
      - "tests/test_dependency_checker_v2.py"
      - "tests/test_web_server.py"
      - "tests/test_web_module_bridge.py"
      - "tests/test_web_ui_contract.py"
      - "tests/test_module_api_validator.py"
      - "tests/test_module_checker.py"
      - "tests/test_datei_manager_window.py"
      - "tests/test_archiv_manager_window.py"
      - "docs/PROVOWARE_MEMO_STARTUP.md"
      - ".github/workflows/provoware-memo-startup-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systemvoraussetzungen installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth zip rsync
      - name: Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r config/requirements.txt
      - name: Neue Vorvalidierungs- und Resolververträge testen
        run: >-
          python -m pytest -q
          tests/test_startup_preflight.py
          tests/test_dependency_checker_v2.py
          tests/test_web_server.py
          tests/test_web_module_bridge.py
          tests/test_web_ui_contract.py
      - name: Archiv-Regression testen
        run: >-
          python -m pytest -q
          tests/test_archiv_manager_service.py
          tests/test_archiv_manager_cli.py
          tests/test_archiv_manager_aliases.py
          tests/test_archiv_manager_entry.py
      - name: Tkinter-Regression unter Xvfb testen
        run: >-
          xvfb-run -a -s "-screen 0 1440x1000x24"
          python -m pytest -q tests/test_archiv_manager_window.py
      - name: Shell- und Python-Syntax prüfen
        run: |
          bash -n scripts/start.sh klick_start.sh scripts/ensure_venv.sh scripts/check_env.sh scripts/run_tests.sh
          python -m py_compile system/startup_preflight.py system/dependency_checker.py system/web_server.py system/web_module_bridge.py scripts/web_interaction_probe.py
          node --check web/app.js
      - name: Vollprojekt-Vorvalidierung ausführen
        run: >-
          python system/startup_preflight.py
          --root .
          --report "$RUNNER_TEMP/ci_preflight_report.json"
      - name: Integrierten Webserver, Portwahl und Browser prüfen
        run: |
          python system/web_server.py --config config/web_server.json --smoke-test --no-browser
          python system/web_server.py \
            --config config/web_server.json \
            --check-only \
            --check-browser \
            --port 0 \
            --runtime-state "$RUNNER_TEMP/web_server_validation.json"
      - name: Reale Google-Chrome-Interaktionen prüfen
        run: python scripts/web_interaction_probe.py --root . --timeout 20
      - name: Vollständige Startkette isoliert nachvalidieren
        run: |
          SMOKE_ROOT="$RUNNER_TEMP/Provoware_Memo_Smoke"
          mkdir -p "$SMOKE_ROOT"
          rsync -a ./ "$SMOKE_ROOT/" \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          cd "$SMOKE_ROOT"
          ./scripts/start.sh --no-start --no-log
      - name: Vollständigen Provoware-Memo-Export erstellen und prüfen
        run: |
          EXPORT_ROOT="$RUNNER_TEMP/Provoware_Memo"
          mkdir -p "$EXPORT_ROOT"
          rsync -a ./ "$EXPORT_ROOT/" \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.coverage' \
            --exclude 'htmlcov/' \
            --exclude 'logs/*.log' \
            --exclude 'data/*.sqlite' \
            --exclude 'data/*.sqlite-*'
          chmod +x \
            "$EXPORT_ROOT/scripts/start.sh" \
            "$EXPORT_ROOT/scripts/ensure_venv.sh" \
            "$EXPORT_ROOT/scripts/check_env.sh" \
            "$EXPORT_ROOT/scripts/run_tests.sh"
          cd "$RUNNER_TEMP"
          zip -qr Provoware_Memo_FULL.zip Provoware_Memo
          unzip -tq Provoware_Memo_FULL.zip
          if unzip -Z1 Provoware_Memo_FULL.zip | grep -Eq \
            '(^|/)(\.git|\.venv|\.pytest_cache|\.ruff_cache|\.mypy_cache|__pycache__|htmlcov)(/|$)|\.pyc$|\.sqlite(-wal|-shm)?$|/logs/[^/]*\.log$'; then
            echo "Fehler: Vollprojekt-ZIP enthält ausgeschlossene Laufzeit- oder Cachedateien." >&2
            exit 1
          fi
          sha256sum Provoware_Memo_FULL.zip > Provoware_Memo_FULL.zip.sha256
          sha256sum -c Provoware_Memo_FULL.zip.sha256
      - name: Vollprojekt-ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Provoware_Memo_FULL
          path: |
            ${{ runner.temp }}/Provoware_Memo_FULL.zip
            ${{ runner.temp }}/Provoware_Memo_FULL.zip.sha256
          if-no-files-found: error
      - name: Arbeitsbaum unverändert halten
        run: git diff --exit-code
