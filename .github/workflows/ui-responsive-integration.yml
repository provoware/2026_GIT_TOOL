name: UI Responsive Integration

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/main_window.py"
      - "system/ui_responsive.py"
      - "scripts/apply_ui_responsive_acceptance.py"
      - "tests/test_ui_responsive.py"
      - "tests/test_ui_responsive_codemod.py"
      - ".github/workflows/ui-responsive-integration.yml"

permissions:
  contents: write

jobs:
  responsive-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Responsive-Regeln und Codemod testen
        run: >-
          python -m pytest -q
          tests/test_ui_responsive.py
          tests/test_ui_responsive_codemod.py
      - name: Beide vollständigen UI-Dateien transformieren
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          cp system/main_window.py /tmp/main_window.py
          python scripts/apply_ui_responsive_acceptance.py \
            --launcher /tmp/launcher_gui.py \
            --main-window /tmp/main_window.py
          python scripts/apply_ui_responsive_acceptance.py \
            --check \
            --launcher /tmp/launcher_gui.py \
            --main-window /tmp/main_window.py
          python -m py_compile \
            /tmp/launcher_gui.py \
            /tmp/main_window.py \
            system/ui_responsive.py
      - name: Responsive-Layout integrieren
        if: github.head_ref == 'agent/ui-acceptance-linux-mobile'
        run: python scripts/apply_ui_responsive_acceptance.py
      - name: Minimalen Produktionscommit veröffentlichen
        if: github.head_ref == 'agent/ui-acceptance-linux-mobile'
        run: |
          if git diff --quiet -- system/launcher_gui.py system/main_window.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/launcher_gui.py system/main_window.py
          git commit -m "UI-Abnahme: responsive Fenster integrieren [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Repository sauber halten
        run: git diff --exit-code
