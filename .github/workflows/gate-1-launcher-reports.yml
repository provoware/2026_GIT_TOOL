name: Gate 1 Launcher Reports

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/launcher_reports.py"
      - "scripts/apply_gate1_launcher_reports.py"
      - "tests/test_launcher_reports.py"
      - "tests/test_gate1_launcher_codemod.py"
      - ".github/workflows/gate-1-launcher-reports.yml"
  push:
    branches:
      - "agent/gate-1-launcher-reports"

permissions:
  contents: read

jobs:
  gate-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check pytest

      - name: Reine Berichtformatierer testen
        run: python -m pytest -q tests/test_launcher_reports.py tests/test_gate1_launcher_codemod.py

      - name: Codemod auf Arbeitskopie anwenden
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          python scripts/apply_gate1_launcher_reports.py --path /tmp/launcher_gui.py
          python scripts/apply_gate1_launcher_reports.py --check --path /tmp/launcher_gui.py
          python -m py_compile /tmp/launcher_gui.py system/launcher_reports.py

      - name: Änderungsgrenze prüfen
        run: |
          git diff --exit-code
