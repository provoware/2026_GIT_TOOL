name: Gate 1 Launcher Reports

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/launcher_reports.py"
      - "scripts/apply_gate1_launcher_reports.py"
      - "tests/test_launcher_reports.py"
      - "tests/test_gate1_launcher_codemod.py"
      - ".github/workflows/gate-1-launcher-reports.yml"
  push:
    branches:
      - "agent/gate-1-launcher-reports"

permissions:
  contents: write

jobs:
  gate-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check pytest

      - name: Reine Berichtformatierer testen
        run: python -m pytest -q tests/test_launcher_reports.py tests/test_gate1_launcher_codemod.py

      - name: Codemod auf Arbeitskopie prüfen
        run: |
          cp system/launcher_gui.py /tmp/launcher_gui.py
          python scripts/apply_gate1_launcher_reports.py --path /tmp/launcher_gui.py
          python scripts/apply_gate1_launcher_reports.py --check --path /tmp/launcher_gui.py
          python -m py_compile /tmp/launcher_gui.py system/launcher_reports.py

      - name: Codemod in Arbeitsbranch integrieren
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/apply_gate1_launcher_reports.py --path system/launcher_gui.py
          python scripts/apply_gate1_launcher_reports.py --check --path system/launcher_gui.py
          python -m py_compile system/launcher_gui.py system/launcher_reports.py
          python -m pytest -q tests/test_launcher_reports.py tests/test_gate1_launcher_codemod.py

      - name: Minimalen Integrationscommit veröffentlichen
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- system/launcher_gui.py; then
            echo "Codemod war bereits integriert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/launcher_gui.py
          git commit -m "Launcher-Berichtformatierer integrieren"
          git push

      - name: Änderungsgrenze prüfen
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        run: git diff --exit-code
