name: Format Provoware Web Once

on:
  pull_request:
    paths:
      - "system/web_server.py"
      - "tests/test_web_server.py"
      - ".github/workflows/format-web-once.yml"

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Black installieren und exakt formatieren
        run: |
          python -m pip install --disable-pip-version-check "black>=24.0.0"
          python -m black \
            system/web_server.py \
            tests/test_web_server.py \
            --config config/black.toml
      - name: Einmaligen Workflow entfernen und Branch aktualisieren
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/format-web-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/web_server.py tests/test_web_server.py .github/workflows/format-web-once.yml
          git diff --cached --check
          git commit -m "Formatiere integrierten Webserver mit Black"
          git push origin "HEAD:${HEAD_BRANCH}"
