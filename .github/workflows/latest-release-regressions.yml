name: Latest Release Regressions

on:
  pull_request:
    paths:
      - "system/main_window.py"
      - "system/module_history.py"
      - "system/module_lifecycle.py"
      - "system/module_manager.py"
      - "system/workspace_geometry.py"
      - "modules/datei_manager/browser.py"
      - "modules/datei_manager/entry.py"
      - "tests/test_latest_release_regressions.py"
      - "tests/test_workspace_geometry.py"
      - "tests/test_module_lifecycle.py"
      - "tests/test_module_manager.py"
      - "tests/test_module_history.py"
      - "tests/test_datei_manager_browser.py"
      - "tests/test_datei_manager_entry.py"
      - "scripts/run_latest_release_tests.sh"
      - ".github/workflows/latest-release-regressions.yml"
  push:
    branches:
      - main
    paths:
      - "system/main_window.py"
      - "system/module_history.py"
      - "system/module_lifecycle.py"
      - "system/module_manager.py"
      - "system/workspace_geometry.py"
      - "modules/datei_manager/browser.py"
      - "modules/datei_manager/entry.py"
      - "tests/test_latest_release_regressions.py"
      - "tests/test_workspace_geometry.py"
      - "tests/test_module_lifecycle.py"
      - "tests/test_module_manager.py"
      - "tests/test_module_history.py"
      - "tests/test_datei_manager_browser.py"
      - "tests/test_datei_manager_entry.py"
      - "scripts/run_latest_release_tests.sh"
      - ".github/workflows/latest-release-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-release-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check pytest

      - name: Release-Regressionsprüfung ausführen
        run: bash scripts/run_latest_release_tests.sh

      - name: Repository nach Tests unverändert halten
        run: git diff --exit-code
