name: MCP dispatch contract

on:
  pull_request:
    paths:
      - 'mcp_dispatch/**'
      - '.github/workflows/mcp-dispatch-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp_dispatch/**'
      - '.github/workflows/mcp-dispatch-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp_dispatch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp_dispatch/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q -f src tests
      - run: ruff check src tests
      - run: pytest
