name: Gate 6 Module Lifecycle

on:
  pull_request:
    paths:
      - "system/main_window.py"
      - "system/module_lifecycle.py"
      - "system/module_manager.py"
      - "scripts/apply_gate6_module_lifecycle.py"
      - "tests/test_module_lifecycle.py"
      - "tests/test_gate6_module_lifecycle_codemod.py"
      - ".github/workflows/gate-6-module-lifecycle.yml"

permissions:
  contents: write

jobs:
  gate-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Modulkarten und Close-Policy testen
        run: >-
          python -m pytest -q
          tests/test_module_lifecycle.py
          tests/test_gate6_module_lifecycle_codemod.py
      - name: Codemod auf vollständiger Arbeitskopie prüfen
        run: |
          cp system/main_window.py /tmp/main_window.py
          python scripts/apply_gate6_module_lifecycle.py --path /tmp/main_window.py
          python scripts/apply_gate6_module_lifecycle.py --check --path /tmp/main_window.py
          python -m py_compile /tmp/main_window.py system/module_lifecycle.py
      - name: Modul-Lifecycle integrieren
        if: github.head_ref == 'agent/gate-6-module-lifecycle'
        run: python scripts/apply_gate6_module_lifecycle.py
      - name: Minimalen Integrationscommit veröffentlichen
        if: github.head_ref == 'agent/gate-6-module-lifecycle'
        run: |
          if git diff --quiet -- system/main_window.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/main_window.py
          git commit -m "Gate 6: Modul-Lifecycle integrieren [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Repository sauber halten
        run: git diff --exit-code
