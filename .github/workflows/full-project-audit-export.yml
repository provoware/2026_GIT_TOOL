name: Full Project Audit and Export

on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-project-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository vollständig auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prüfabhängigkeiten installieren
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest pillow

      - name: Vollständigen Projekt-Audit ausführen
        run: bash scripts/full_project_audit.sh

      - name: Geprüften Projektbestand zusammenstellen
        run: |
          set -euo pipefail
          PACKAGE_ROOT="2026_GIT_TOOL_geprueft"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT"
          rsync -a ./ "$PACKAGE_ROOT/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude 'node_modules/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude 'dist/' \
            --exclude '*.pyc' \
            --exclude '2026_GIT_TOOL_geprueft/'
          mkdir -p "$PACKAGE_ROOT/.github/workflows"
          cp .github/workflows/*.yml "$PACKAGE_ROOT/.github/workflows/" 2>/dev/null || true
          cp .github/workflows/*.yaml "$PACKAGE_ROOT/.github/workflows/" 2>/dev/null || true
          printf '%s\n' "$(git rev-parse HEAD)" > "$PACKAGE_ROOT/GEPRUEFTER_COMMIT.txt"
          cp -R build/full-project-audit "$PACKAGE_ROOT/PRUEFBERICHTE"
          zip -r -9 2026_GIT_TOOL_geprueft.zip "$PACKAGE_ROOT"
          unzip -t 2026_GIT_TOOL_geprueft.zip

      - name: ZIP und Prüfberichte veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: 2026_GIT_TOOL-geprueft-vollstaendig
          path: |
            2026_GIT_TOOL_geprueft.zip
            build/full-project-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Repository nach Prüfungen unverändert halten
        run: |
          git status --short
          test -z "$(git status --short --untracked-files=no)"
