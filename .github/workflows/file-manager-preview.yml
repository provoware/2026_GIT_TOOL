name: File Manager Preview and Sorting

on:
  pull_request:
    paths:
      - "modules/datei_manager/**"
      - "config/datei_manager.json"
      - "config/requirements.txt"
      - "scripts/capture_file_manager_preview.py"
      - "tests/test_datei_manager_browser.py"
      - "tests/test_datei_manager_entry.py"
      - "tests/test_datei_manager_window.py"
      - ".github/workflows/file-manager-preview.yml"

permissions:
  contents: read

jobs:
  file-manager-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tk- und Screenshot-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb imagemagick
      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check pytest Pillow
      - name: Browser- und Modulvertrag testen
        run: >-
          python -m pytest -q
          tests/test_datei_manager_browser.py
          tests/test_datei_manager_entry.py
      - name: Echte Tk-Listenansicht und Vorschau testen
        run: >-
          xvfb-run -a -s "-screen 0 1440x1000x24"
          python -m pytest -q tests/test_datei_manager_window.py
      - name: Visuellen Vorschau-Beleg erzeugen
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1440x1000x24" \
            python scripts/capture_file_manager_preview.py \
            --output artifacts/datei-manager-bildvorschau.png
      - name: Syntax prüfen
        run: >-
          python -m py_compile
          modules/datei_manager/browser.py
          modules/datei_manager/window.py
          modules/datei_manager/entry.py
          modules/datei_manager/__main__.py
          scripts/capture_file_manager_preview.py
      - name: Screenshotbeleg veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-preview-evidence
          path: artifacts/datei-manager-bildvorschau.png
          if-no-files-found: error
      - name: Repository unverändert halten
        run: git diff --exit-code
