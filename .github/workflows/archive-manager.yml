name: Archive Manager Shared Database

on:
  pull_request:
    paths:
      - "modules/archiv_manager/**"
      - "config/modules.json"
      - "docs/ARCHIV_MANAGER.md"
      - "tests/test_archiv_manager_*.py"
      - ".github/workflows/archive-manager.yml"

permissions:
  contents: read

jobs:
  archive-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tk-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check pytest
      - name: Service-, CLI- und Modulverträge testen
        run: >-
          python -m pytest -q
          tests/test_archiv_manager_service.py
          tests/test_archiv_manager_cli.py
          tests/test_archiv_manager_entry.py
      - name: Grafisches Archiv-Modul unter Xvfb testen
        run: >-
          xvfb-run -a -s "-screen 0 1440x1000x24"
          python -m pytest -q tests/test_archiv_manager_window.py
      - name: Syntax prüfen
        run: python -m py_compile modules/archiv_manager/*.py
      - name: Repository unverändert halten
        run: git diff --exit-code
