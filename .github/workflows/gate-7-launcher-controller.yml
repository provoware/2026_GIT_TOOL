name: Gate 7 Launcher Controller

on:
  pull_request:
    paths:
      - "system/launcher_gui.py"
      - "system/launcher_controller.py"
      - "system/undo_redo.py"
      - "scripts/apply_gate7_launcher_controller.py"
      - "scripts/apply_gate7_launcher_controller_v2.py"
      - "tests/test_launcher_controller.py"
      - "tests/test_gate7_launcher_controller_codemod.py"
      - ".github/workflows/gate-7-launcher-controller.yml"

permissions:
  contents: read

jobs:
  gate-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Controller, Teilviews und Verlauf testen
        run: >-
          python -m pytest -q
          tests/test_launcher_controller.py
          tests/test_gate7_launcher_controller_codemod.py
      - name: Integrierten Zustand prüfen
        run: |
          python scripts/apply_gate7_launcher_controller_v2.py --check
          python -m py_compile system/launcher_gui.py system/launcher_controller.py
      - name: Repository unverändert halten
        run: git diff --exit-code
