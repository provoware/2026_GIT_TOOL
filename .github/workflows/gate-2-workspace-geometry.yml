name: Gate 2 Workspace Geometry

on:
  pull_request:
    paths:
      - "system/main_window.py"
      - "system/workspace_geometry.py"
      - "scripts/apply_gate2_workspace_geometry.py"
      - "tests/test_workspace_geometry.py"
      - "tests/test_gate2_workspace_codemod.py"
      - ".github/workflows/gate-2-workspace-geometry.yml"
  push:
    branches:
      - "agent/gate-2-workspace-geometry*"

permissions:
  contents: write

jobs:
  gate-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Geometrie und Codemod testen
        run: python -m pytest -q tests/test_workspace_geometry.py tests/test_gate2_workspace_codemod.py
      - name: Codemod auf Arbeitskopie prüfen
        run: |
          cp system/main_window.py /tmp/main_window.py
          python scripts/apply_gate2_workspace_geometry.py --path /tmp/main_window.py
          python scripts/apply_gate2_workspace_geometry.py --check --path /tmp/main_window.py
          python -m py_compile /tmp/main_window.py system/workspace_geometry.py
      - name: Codemod in Arbeitsbranch integrieren
        if: github.event_name == 'push'
        run: python scripts/apply_gate2_workspace_geometry.py
      - name: Minimalen Integrationscommit veröffentlichen
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/main_window.py
          git commit -m "Gate 2: Workspace-Geometrie integrieren [skip ci]"
          git push
      - name: Änderungsgrenze prüfen
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
